/* Layout: cột trái chọn khối, lớp, học sinh; cột phải là hồ sơ (xếp dọc trên điện thoại). */
:root{

  --accent:#0E7A70; --accent-ink:#FFFFFF; --accent-soft:#D9EFEB;

  --l1:#B5402E; --l2:#B77A0C; --l3:#0E7A70; --l4:#2F5BB7;
  --s1:#0E7A70; --s2:#C98A10; --s3:#7A5BB5; --s4:#6B7B7C;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1F; --surface:#162628; --ink:#E4EFEE; --muted:#93A9A9; --line:#2A3F41;
    --accent:#4FC3B5; --accent-ink:#082220; --accent-soft:#1B3B3A;
    --warn:#E7A455; --warn-soft:#3A2A14;
    --l1:#EE7C69; --l2:#E2AB45; --l3:#4FC3B5; --l4:#7FA3F0;
    --s1:#4FC3B5; --s2:#E2AB45; --s3:#B79AEA; --s4:#9BB0B0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1F; --surface:#162628; --ink:#E4EFEE; --muted:#93A9A9; --line:#2A3F41;
  --accent:#4FC3B5; --accent-ink:#082220; --accent-soft:#1B3B3A;
  --warn:#E7A455; --warn-soft:#3A2A14;
  --l1:#EE7C69; --l2:#E2AB45; --l3:#4FC3B5; --l4:#7FA3F0;
  --s1:#4FC3B5; --s2:#E2AB45; --s3:#B79AEA; --s4:#9BB0B0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.top .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);white-space:nowrap}
.pill.ok{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.side{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.side input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:8px 10px;font:inherit}
.khoi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.khoi button{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.khoi b{font-size:15px;font-weight:700}
.khoi span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.khoi button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.khoi button[aria-pressed=true] span{color:var(--accent-ink);opacity:.85}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.chips b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.chips span{font-size:11.5px;color:var(--muted)}
.chips button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.mini{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;max-height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
.list button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.list li:last-child button{border-bottom:0}
.list button[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.list .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.list .st{font-size:11.5px;color:var(--muted);white-space:nowrap}
.list .st.ok{color:var(--accent);font-weight:600}
.list .st.warn{color:var(--warn);font-weight:600}
.fine{font-size:12.5px;color:var(--muted)}

.main{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.head{padding:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.head h2{font-size:22px;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-size:13.5px}
.facts b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:2px;margin-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{padding:18px 20px 24px;display:flex;flex-direction:column;gap:20px;min-width:0}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:6px 10px;max-width:100%}
.progress{display:flex;align-items:center;gap:10px;min-width:200px;flex:1}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor;vertical-align:-1px}
.lg1::before{color:var(--l1)}.lg2::before{color:var(--l2)}.lg3::before{color:var(--l3)}.lg4::before{color:var(--l4)}

.skill{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.skill h3{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.skill h3 .avg{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.ind{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
@media (max-width:620px){.ind{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);width:40px;height:34px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{color:#fff;font-weight:600}
.seg button[data-v="1"][aria-pressed=true]{background:var(--l1)}
.seg button[data-v="2"][aria-pressed=true]{background:var(--l2)}
.seg button[data-v="3"][aria-pressed=true]{background:var(--l3)}
.seg button[data-v="4"][aria-pressed=true]{background:var(--l4)}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#0B1516}

.seg button[disabled]{cursor:not-allowed}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:8px 10px;font:inherit;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.chartrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}

svg text{fill:var(--ink);font-family:var(--font)}
.radar{width:100%;height:auto;max-width:480px;margin:0 auto;display:block}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.cols{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:18px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col .v{font-family:var(--mono);font-size:11px}
.col i{display:block;width:100%;background:var(--s4);border-radius:2px 2px 0 0;opacity:.55}
.col.cur i{background:var(--accent);opacity:1}
.col .l{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.up{color:var(--l3)}.down{color:var(--l1)}.flat{color:var(--muted)}

.years{display:flex;flex-direction:column}
.yr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 18px;padding:16px 0;border-top:1px solid var(--line)}

.yr .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}

  h+='<text x="'+(cx+Math.cos(a)*(R+14))+'" y="'+(cy+Math.sin(a)*(R+14)+4)+'" font-size="12" text-anchor="'+(Math.abs(c)<.2?"middle":c>0?"start":"end")+'">'+k.s+'</text>'});
 [2,3,4].forEach(function(l){h+='<text x="'+(cx+4)+'" y="'+(cy-R*l/4+3)+'" font-size="9" style="fill:var(--muted)">'+l+'</text>'});

  var pts=s.v.map(function(v,i){return pt(i,v==null?0:v).join(",")}).join(" ");
